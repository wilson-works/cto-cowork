<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="cowork-token" content="__COWORK_TOKEN__">
<title>James and John's Coworking Space</title>
<link rel="icon" href="/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="top">
  <img class="mark" src="/mark.svg" alt="" width="44" height="44">
  <div class="plate">
    <h1>James and John's Coworking Space</h1>
    <p class="line">The CTO and the Chief Engineer plan your next run and hand you the paste blocks.</p>
  </div>
</header>

<section class="stage" aria-label="The office right now">
  <figure class="scene-box">
    <div class="scene" id="scene" data-scene="idle"><img src="/art.svg" alt="James stands easy by the run board with a coffee; John is on the sofa reading a diff. Dinner waits on the coffee table in takeout boxes." width="640" height="400"></div>
    <figcaption id="scene-cap">In the office. Dinner's on the table.</figcaption>
  </figure>
</section>

<main class="room">
  <section class="desk" aria-labelledby="ask-h">
    <h2 id="ask-h" class="tape">New direction</h2>
    <form id="ask" novalidate>
      <label for="direction">Tell James and John what you need</label>
      <textarea id="direction" name="direction" rows="6" maxlength="4000" required
        placeholder="For example: plan a one-lane run that checks every agent door's phone address answers."></textarea>
      <label class="switch"><input type="checkbox" id="training" role="switch"> Training run (a proof, filed under runs/training, never launched)</label>
      <button type="submit" id="go">Start</button>
      <p class="hint" id="ask-msg" role="status" aria-live="polite"></p>
    </form>
    <div id="now" class="now" hidden>
      <p class="card"><span class="tag">IN SESSION</span> <span id="now-text"></span></p>
      <button type="button" id="stop" class="quiet">Stop this run</button>
    </div>
    <p class="joke" id="joke"></p>
  </section>

  <section class="runs" aria-labelledby="runs-h">
    <h2 id="runs-h" class="tape">Runs</h2>
    <ol id="list" class="list"></ol>
    <p id="empty" class="hint" hidden>No runs yet. Give them a direction and they will compose one.</p>
  </section>
</main>
<p class="sr" id="live" aria-live="polite"></p>
</body>
</html>
